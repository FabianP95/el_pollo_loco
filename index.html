<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El pollo loco</title>
    <link rel="icon" href="./assets/favicon/icon.png" type="image/x-icon">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/styles/fonts.css">
    <link rel="stylesheet" href="/styles/standard.css">




    <script src="classes/keyboard.class.js"></script>
    <script src="classes/drawable-object.class.js"></script>
    <script src="classes/movable-object.class.js"></script>
    <script src="classes/statusbars/statusbar-bottle.class.js"></script>
    <script src="classes/statusbars/statusbar-coin.class.js"></script>
    <script src="classes/statusbars/statusbar-health.class.js"></script>
    <script src="classes/statusbars/statusbar-boss.class.js"></script>
    <script src="classes/stuff-in-world/coin.class.js"></script>
    <script src="classes/stuff-in-world/bottles.class.js"></script>
    <script src="classes/enemies/little-chicken.class.js"></script>
    <script src="classes/enemies/chicken.class.js"></script>
    <script src="classes/background_object.class.js"></script>
    <script src="classes/stuff-in-world/cloud.class.js"></script>
    <script src="classes/character/character.class.js"></script>
    <script src="classes/enemies/endboss.class.js"></script>
    <script src="classes/screens/game-over-screen.class.js"></script>
    <script src="classes/character/throwable-object.class.js"></script>

    <script src="classes/level.class.js"></script>

    <script src="classes/world.class.js"></script>
    <script src="classes/screens/startScreen.class.js"></script>
    <script src="scripts/template.js"></script>
    <script src="classes/levels/level1.js" defer></script>










</head>

<body onload="startScreen()">
    <header>
        <h1 class="game-title">El pollo loco</h1>
    </header>
    <main class="main-container">
        <canvas id="canvas" class="canvas" width="1050px" height="480px">
            Your browser does not support the canvas tag.
        </canvas>
        <dialog id="startDialog" class="dialogWindow" open>
            <div class="modal"><button class="start-btn" onclick="startGame()">Start the game</button>
            </div>
        </dialog>
        <div class="button-row">
            <button id="screenBtn" onclick="setScreen()" class="button-settings">
                <svg class="fullscreen-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="4 9 4 4 9 4" />
                    <polyline points="15 4 20 4 20 9" />
                    <polyline points="4 15 4 20 9 20" />
                    <polyline points="20 15 20 20 15 20" />
                </svg>
            </button>
            <button id="muteBtn" onclick="applyMute(getMute())" class="button-settings">

            </button>
        </div>
        <div class="control-display">
            <h2>Controls:</h2>
            <div class="button-row">
                <button id="btnA" class="button-control">A
                </button>
                <button id="btnD" class="button-control">D
                </button>
                <button id="btnSpace" class="button-control">
                    Space
                </button>
                <button id="btnG" class="button-control">
                    G
                </button>
            </div>
        </div>

    </main>
    <footer>
        <a class="footer-link" href="./html/legal_notice.html">Impressum</a>
    </footer>






</body>
<script src="./scripts/game.js"></script>
<script src="/script.js"></script>

</html>
