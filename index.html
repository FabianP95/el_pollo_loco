<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El pollo loco</title>
    <link rel="icon" href="./assets/favicon/icon.png" type="image/x-icon">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/responsive.css">


    <script src="classes/keyboard.class.js"></script>
    <script src="classes/drawable-object.class.js"></script>
    <script src="classes/movable-object.class.js"></script>
    <script src="classes/statusbars/statusbar-bottle.class.js"></script>
    <script src="classes/statusbars/statusbar-coin.class.js"></script>
    <script src="classes/statusbars/statusbar-health.class.js"></script>
    <script src="classes/statusbars/statusbar-boss.class.js"></script>
    <script src="classes/stuff-in-world/coin.class.js"></script>
    <script src="classes/stuff-in-world/bottles.class.js"></script>
    <script src="classes/enemies/little-chicken.class.js"></script>
    <script src="classes/enemies/chicken.class.js"></script>
    <script src="classes/background_object.class.js"></script>
    <script src="classes/stuff-in-world/cloud.class.js"></script>
    <script src="classes/character/character.class.js"></script>
    <script src="classes/enemies/endboss.class.js"></script>
    <script src="classes/screens/game-over-screen.class.js"></script>
    <script src="classes/character/throwable-object.class.js"></script>
    <script src="classes/level.class.js"></script>
    <script src="classes/world.class.js"></script>
    <script src="classes/screens/startScreen.class.js"></script>
    <script src="scripts/template.js"></script>
    <script src="classes/levels/level1.js" defer></script>

</head>

<body onload="startScreen(), accessMobileBtns()">
    <header>
        <h1 class="game-title">El pollo loco</h1>
    </header>
    <main class="main-container">
        <div class="canvas-area" id="gameArea">
            <canvas id="canvas" class="canvas" width="1050px" height="480px">
                Your browser does not support the canvas tag.
            </canvas>
            <div class="settings-hud">
                <button id="muteBtn" onclick="applyMute(getMute())" class="button-settings">
                </button>
            </div>
            <div class="control-hud">
                <div class="control-display">
                    <div class="button-row">
                        <button id="btnA" class="button-control"><img class="control-img"
                                src="./assets/icons/arrow_back_ios_40dp_FFFFFF_FILL0_wght400_GRAD0_opsz40.svg"
                                alt="walk left">
                        </button>
                        <button id="btnD" class="button-control"><img class="control-img"
                                src="./assets/icons/arrow_forward_ios_40dp_FFFFFF_FILL0_wght400_GRAD0_opsz40.svg"
                                alt="walk right">
                        </button>
                        <button id="btnSpace" class="button-control">
                            <img class="control-img"
                                src="./assets/icons/keyboard_double_arrow_up_40dp_FFFFFF_FILL0_wght400_GRAD0_opsz40.svg"
                                alt="jump">
                        </button>
                        <button id="btnG" class="button-control">
                            <img class="control-img"
                                src="./assets/icons/swords_40dp_FFFFFF_FILL0_wght400_GRAD0_opsz40.svg"
                                alt="attack with a bottle">
                        </button>
                    </div>
                </div>
            </div>
            <dialog id="startDialog" class="dialogWindow modal" open>
                <button id="startBtn" class="start-btn" onclick="startGame()">Start the game</button>
            </dialog>
        </div>
        <div class="controls-info">
            <h2>Controls</h2>
            <div class="controls">
                <p>Walk: A or D</p>
                <p>Jump: Spacebar</p>
                <p>Throw: G</p>
            </div>
        </div>
        <div id="rotate-overlay">
            <div class="rotate-content">
                <div class="svg-wrapper">
                    <svg class="arc-wrap" viewBox="0 0 110 110" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 80 20 A 42 42 0 0 0 20 72" stroke="#63ffc8" stroke-width="2" stroke-linecap="round"
                            stroke-dasharray="6 5" />
                        <polyline points="12,66 20,72 26,63" stroke="#63ffc8" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" fill="none" />
                    </svg>
                    <div class="phone-wrap">
                        <svg class="phone-svg" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="12" y="4" width="32" height="48" rx="6" stroke="#63ffc8" stroke-width="2.5" />
                            <rect x="22" y="9" width="12" height="3" rx="1.5" fill="#63ffc8" opacity="0.5" />
                            <rect x="23" y="44" width="10" height="2.5" rx="1.25" fill="#63ffc8" opacity="0.5" />
                            <line x1="18" y1="16" x2="18" y2="28" stroke="rgba(99,255,200,0.15)" stroke-width="3"
                                stroke-linecap="round" />
                        </svg>
                    </div>
                </div>
                <div class="text-block">
                    <p class="rotate-title">Rotate your device</p>
                    <p class="rotate-sub">Best viewed in landscape mode</p>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <a class="footer-link" href="./html/legal_notice.html">Impressum</a>
    </footer>






</body>
<script src="./scripts/game.js"></script>
<script src="./script.js"></script>

</html>
