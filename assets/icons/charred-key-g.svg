<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50" fill="none">
  <defs>
    <linearGradient id="charG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1800"/>
      <stop offset="50%" stop-color="#1a0d00"/>
      <stop offset="100%" stop-color="#0e0700"/>
    </linearGradient>
    <linearGradient id="shimG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="40%" stop-color="#ff8c00cc"/>
      <stop offset="50%" stop-color="#ffcc44"/>
      <stop offset="60%" stop-color="#ff8c00cc"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Outer black cartoon border -->
  <rect x="1" y="1" width="48" height="48" rx="10" ry="10" fill="#000"/>

  <!-- Charred wood body -->
  <rect x="3" y="3" width="44" height="44" rx="8" ry="8" fill="url(#charG)"/>

  <!-- Crack lines -->
  <line x1="10" y1="12" x2="22" y2="28" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>
  <line x1="32" y1="10" x2="45" y2="25" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>
  <line x1="8"  y1="40" x2="30" y2="22" stroke="rgba(0,0,0,0.2)"  stroke-width="0.8"/>

  <!-- Inner border glow -->
  <rect x="3" y="3" width="44" height="44" rx="8" ry="8"
    fill="none" stroke="#6b2f00" stroke-width="1.5"/>

  <!-- Top hot-edge shimmer -->
  <line x1="12" y1="4.5" x2="38" y2="4.5"
    stroke="url(#shimG)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bottom shadow -->
  <rect x="5" y="43" width="40" height="4" rx="4" ry="4" fill="rgba(0,0,0,0.5)"/>

  <!-- Letter G with outline + fill -->
  <text x="25" y="34"
    font-family="'Boogaloo', 'Arial Black', sans-serif"
    font-size="26" font-weight="700"
    fill="none" stroke="#000" stroke-width="3" stroke-linejoin="round"
    text-anchor="middle" opacity="0.4">G</text>
  <text x="25" y="34"
    font-family="'Boogaloo', 'Arial Black', sans-serif"
    font-size="26" font-weight="700"
    fill="#ffcc44" text-anchor="middle">G</text>
</svg>
